<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Confirmação de Idade | 18+</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔞</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    :root {
      --primary-yellow: #f8c102;
      --bg-yellow: #f6be00;
      --card-bg: #ffffff;
      --btn-hover: #e0ac00;
    }

    body {
      background-color: var(--bg-yellow);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 20px;
    }

    .bg-shape-top-left {
      position: fixed;
      top: -120px;
      left: -120px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 235, 120, 0.45) 0%, rgba(246, 190, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .bg-shape-bottom-right {
      position: fixed;
      bottom: -150px;
      right: -150px;
      width: 480px;
      height: 480px;
      border: 45px solid rgba(255, 230, 100, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .presell-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
      padding: 34px 36px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out forwards;
    }

    .accent-bar {
      width: 46px;
      height: 4.5px;
      background-color: var(--primary-yellow);
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 0.94rem;
      color: #6b7280;
      margin-bottom: 26px;
      line-height: 1.4;
    }

    .button-group {
      display: flex;
      gap: 14px;
      width: 100%;
      margin-bottom: 22px;
    }

    .btn {
      flex: 1;
      padding: 13px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid transparent;
      user-select: none;
    }

    .btn-no {
      background: #ffffff;
      border-color: #d1d5db;
      color: #374151;
    }

    .btn-no:hover {
      background-color: #f9fafb;
    }

    .btn-yes {
      background-color: var(--primary-yellow);
      color: #111827;
      border-color: var(--primary-yellow);
      box-shadow: 0 2px 4px rgba(246, 190, 0, 0.25);
    }

    .btn-yes:hover {
      background-color: var(--btn-hover);
    }

    .footer-note {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    .cookie-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background-color: #1e1e1e;
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 40px);
      max-width: 620px;
      gap: 16px;
    }

    .cookie-content {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.82rem;
    }

    .cookie-dot {
      width: 7px;
      height: 7px;
      background-color: var(--primary-yellow);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cookie-btn {
      background-color: var(--primary-yellow);
      color: #111827;
      border: none;
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .presell-card { padding: 28px 20px 24px; }
      .title { font-size: 1.25rem; }
      .cookie-banner {
        flex-direction: column;
        align-items: flex-start;
        bottom: 12px;
        width: calc(100% - 24px);
      }
      .cookie-btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="bg-shape-top-left"></div>
  <div class="bg-shape-bottom-right"></div>

  <main class="presell-card">
    <div class="accent-bar"></div>
    <h1 class="title">Você tem 18 anos ou mais?</h1>
    <p class="subtitle">Confirme que você é maior de idade para entrar.</p>

    <div class="button-group">
      <button type="button" class="btn btn-no" id="btn-no">Não</button>
      <button type="button" class="btn btn-yes" id="btn-yes">Sim, tenho 18+</button>
    </div>

    <p class="footer-note">Acesso permitido apenas para maiores de 18 anos</p>
  </main>

  <aside class="cookie-banner" id="cookie-banner">
    <div class="cookie-content">
      <div class="cookie-dot"></div>
      <div>
        <span style="font-weight: 700;">Preferências de cookies</span><br>
        <span style="color: #d1d5db;">Usamos cookies para melhorar sua navegação. <u style="color: #f8c102;">Política de Privacidade</u></span>
      </div>
    </div>
    <button type="button" class="cookie-btn" id="accept-cookies">Aceitar</button>
  </aside>

  <script>
    const CONFIG = {
      TARGET_URL: "./inicio/ze/index.html",
      FALLBACK_URL: "https://www.google.com.br",
      PRESERVE_UTMS: true
    };

    document.getElementById('btn-yes').addEventListener('click', function() {
      let dest = CONFIG.TARGET_URL;
      if (CONFIG.PRESERVE_UTMS && window.location.search) {
        const sep = dest.includes('?') ? '&' : '?';
        dest = dest + sep + window.location.search.replace(/^\\?/, '');
      }
      window.location.href = dest;
    });

    document.getElementById('btn-no').addEventListener('click', function() {
      alert("Acesso restrito apenas a pessoas maiores de 18 anos.");
      window.location.href = CONFIG.FALLBACK_URL;
    });

    document.getElementById('accept-cookies').addEventListener('click', function() {
      document.getElementById('cookie-banner').style.display = 'none';
    });
  </script>
</body>
</html>
